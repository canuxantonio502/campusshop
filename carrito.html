<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - CampusShop GT</title>
    <link rel="icon" href="./img/logo.png" type="image/png">
    <link rel="stylesheet" href="./CSS/base.css">
    <link rel="stylesheet" href="./CSS/componentes.css">
    <link rel="stylesheet" href="./CSS/layout.css">
    <link rel="stylesheet" href="./CSS/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header_content">
            <label for="menu-toggle" class="menu-btn">☰</label>
            <a href="index.html" class="logo-link"><img class="logo" src="./img/logo.png" alt="Logo CampusShop"></a>
            <a href="carrito.html" class="carrito-link">
                <img class="logo" src="./img/carrito.png" alt="Carrito de compras">
                <span class="cart-count" id="cartCount" hidden>0</span>
            </a>
        </div>
    </header>

    <input type="checkbox" id="menu-toggle">

    <nav class="menu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="historial.html">Historial</a></li>
        <li><a href="perfil.html">Perfil</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>

    <main class="main_content">
        <a class="btn2" href="catalogo.html">Volver al catálogo</a>
        <section class="content-section" id="cartSection">
            <h2 class="section-title">Mi carrito</h2>
            <div class="cart-list" id="cartItems"></div>
            <hr>
            <article class="card">
                <div class="card_body">
                    <span class="badge">Total</span>
                    <div class="precio_total">
                        <p id="cartTotal">Q.0.00</p>
                        <button class="btn btn-outline" type="button" id="clearCartBtn">Vaciar carrito</button>
                        <a class="btn" href="checkout.html">Terminar compra</a>
                    </div>
                </div>
            </article>
        </section>

        <section class="card_empty" id="cartEmpty" hidden>
            <div class="card_body_empty">
                <h2 class="title">Tu carrito está vacío</h2>
                <div class="carrito"><img src="./img/carrito.png" alt="Carrito vacío"></div>
                <a class="btn" href="catalogo.html">Ver productos</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p> &#174 CampusShop - Proyecto académico</p>
        </div>
    </footer>
    <script src="./JS/productos.js"></script>
    <script src="./JS/storage.js"></script>
    <script src="./JS/ui.js"></script>
    <script src="./JS/carrito.js"></script>
</body>
</html>
