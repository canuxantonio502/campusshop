<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - CampusShop GT</title>
    <link rel="icon" href="./img/logo.png" type="image/png">
    <script src="./JS/tema.js"></script>
    <link rel="stylesheet" href="./CSS/base.css">
    <link rel="stylesheet" href="./CSS/componentes.css">
    <link rel="stylesheet" href="./CSS/layout.css">
    <link rel="stylesheet" href="./CSS/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header_content">
            <label for="menu-toggle" class="menu-btn" aria-label="Abrir menú">☰</label>
            <a href="index.html" class="logo-link"><img class="logo" src="./img/logo.webp" alt="Logo CampusShop" width="120" height="120"></a>
            <div class="header-actions">
                <button class="theme-toggle" type="button" id="themeToggle" aria-label="Cambiar tema"></button>
                <a href="carrito.html" class="carrito-link" aria-label="Carrito de compras">
                    <img class="logo" src="./img/carrito.png" alt="Carrito de compras">
                    <span class="cart-count" id="cartCount" hidden>0</span>
                </a>
            </div>
        </div>
    </header>

    <input type="checkbox" id="menu-toggle">

    <nav class="menu">
        <label for="menu-toggle" class="menu-close" aria-label="Cerrar menú">&times;</label>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="carrito.html">Carrito</a></li>
            <li><a href="historial.html">Historial</a></li>
            <li><a href="perfil.html">Perfil</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
    <label for="menu-toggle" class="menu-overlay" aria-hidden="true"></label>

    <main class="main_content">
        <section class="card">
            <div class="card_body">
                <p class="badge" >Campuslands E-commerce</p>
                <h1 class="title" style="margin: 0;">Bienvenido a CampusShop</h1>
                <p>Compra productos dentro del entorno Campus</p>
                <form class="search-bar" action="catalogo.html" method="get">
                    <input 
                        class="input search-bar"
                        type="search"
                        name="buscar"
                        placeholder="Buscar productos..."
                        aria-label="Buscar productos">
                    <button class="btn search-btn" type="submit">Buscar</button>
                </form>
            </div>
        </section>

        <section>
            <h2 class="title">Categorías</h2>
            <div class="categories-grid">
                <a href="tecnologia.html"><article class="card"><div class="card_body">Tecnología</div></article></a>
                <a href="vestimenta.html"><article class="card"><div class="card_body">Vestimentas</div></article></a>
                <a href="accesorios.html"><article class="card"><div class="card_body">Accesorios</div></article></a>
            </div>
        </section>

        <section class="content-section">
            <h2 class="section-title">Productos destacados</h2>
            <div class="grid-products" id="featuredProducts"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p> &#174 CampusShop - Proyecto académico</p>
        </div>
    </footer>
    <script src="./JS/productos.js"></script>
    <script src="./JS/storage.js"></script>
    <script src="./JS/ui.js"></script>
    <script src="./JS/catalogo.js"></script>
</body>
</html>
