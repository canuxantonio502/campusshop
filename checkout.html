<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - CampusShop GT</title>
    <link rel="icon" href="./img/logo.png" type="image/png">
    <script src="./JS/tema.js"></script>
    <link rel="stylesheet" href="./CSS/base.css">
    <link rel="stylesheet" href="./CSS/componentes.css">
    <link rel="stylesheet" href="./CSS/layout.css">
    <link rel="stylesheet" href="./CSS/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header_content">
            <label for="menu-toggle" class="menu-btn" aria-label="Abrir menú">☰</label>
            <a href="index.html" class="logo-link"><img class="logo" src="./img/logo.webp" alt="Logo CampusShop" width="120" height="120"></a>
            <div class="header-actions">
                <button class="theme-toggle" type="button" id="themeToggle" aria-label="Cambiar tema"></button>
                <a href="carrito.html" class="carrito-link" aria-label="Carrito de compras">
                    <img class="logo" src="./img/carrito.png" alt="Carrito de compras">
                    <span class="cart-count" id="cartCount" hidden>0</span>
                </a>
            </div>
        </div>
    </header>

    <input type="checkbox" id="menu-toggle">

    <nav class="menu">
        <label for="menu-toggle" class="menu-close" aria-label="Cerrar menú">&times;</label>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="carrito.html">Carrito</a></li>
            <li><a href="historial.html">Historial</a></li>
            <li><a href="perfil.html">Perfil</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
    <label for="menu-toggle" class="menu-overlay" aria-hidden="true"></label>

    <main class="main_content page-narrow">
        <a class="btn2" href="carrito.html">Volver al carrito</a>
        <h1>Checkout</h1>
        <form class="checkout" id="checkoutForm" novalidate>
            <section class="card">
                <div class="card_body">
                    <h2 class="title">Envío</h2>
                    <label for="shippingName">Nombre completo</label>
                    <input class="input" type="text" id="shippingName" name="nombre" placeholder="Ingresa tu nombre completo" required>
                    <label for="shippingAddress">Dirección</label>
                    <input class="input" type="text" id="shippingAddress" name="direccion" placeholder="Ingresa tu dirección" required>
                    <label for="shippingCity">Ciudad</label>
                    <input class="input" type="text" id="shippingCity" name="ciudad" placeholder="Ingresa tu ciudad" required>
                </div>
            </section>

            <section class="card">
                <div class="card_body">
                    <h2 class="title">Métodos de pago</h2>
                    <div class="methods" id="paymentMethods">
                        <label class="payment active">
                            <input type="radio" name="metodo" value="Visa" checked>
                            <span>💳</span>
                            <p>Visa</p>
                        </label>
                        <label class="payment">
                            <input type="radio" name="metodo" value="MasterCard">
                            <span>💳</span>
                            <p>MasterCard</p>
                        </label>
                        <label class="payment">
                            <input type="radio" name="metodo" value="Paypal">
                            <span>👛</span>
                            <p>Paypal</p>
                        </label>
                    </div>
                </div>
            </section>

            <section class="summary card">
                <div class="card_body">
                    <h2 class="title">Resumen de tu Orden</h2>
                    <div id="checkoutItems"></div>
                    <hr>
                    <div class="total_summary">
                        <span>Total</span>
                        <strong id="checkoutTotal">Q.0.00</strong>
                    </div>
                </div>
            </section>

            <p class="form-message" id="checkoutMessage"></p>
            <button class="btn_pay" type="submit" id="payBtn">Pagar</button>
        </form>
    </main>

    <footer class="footer">
        <div class="container">
            <p> &#174 CampusShop - Proyecto académico</p>
        </div>
    </footer>
    <script src="./JS/productos.js"></script>
    <script src="./JS/storage.js"></script>
    <script src="./JS/ui.js"></script>
    <script src="./JS/checkout.js"></script>
</body>
</html>
