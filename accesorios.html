<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesorios - CampusShop GT</title>
    <link rel="icon" href="./img/logo.png" type="image/png">
    <link rel="stylesheet" href="./CSS/base.css">
    <link rel="stylesheet" href="./CSS/componentes.css">
    <link rel="stylesheet" href="./CSS/layout.css">
    <link rel="stylesheet" href="./CSS/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header_content">
            <label for="menu-toggle" class="menu-btn" aria-label="Abrir menú">☰</label>
            <a href="index.html" class="logo-link"><img class="logo" src="./img/logo.webp" alt="Logo CampusShop" width="120" height="120"></a>
            <a href="carrito.html" class="carrito-link" aria-label="Carrito de compras">
                <img class="logo" src="./img/carrito.png" alt="Carrito de compras">
                <span class="cart-count" id="cartCount" hidden>0</span>
            </a>
        </div>
    </header>

    <input type="checkbox" id="menu-toggle">

    <nav class="menu">
        <label for="menu-toggle" class="menu-close" aria-label="Cerrar menú">&times;</label>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="carrito.html">Carrito</a></li>
            <li><a href="historial.html">Historial</a></li>
            <li><a href="perfil.html">Perfil</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
    <label for="menu-toggle" class="menu-overlay" aria-hidden="true"></label>

    <main class="main_content">
        <a class="btn2" href="index.html">Volver al inicio</a>
        <section>
            <h1 class="title">Accesorios</h1>
            <div class="card catalog-toolbar">
                <input
                    class="input"
                    type="search"
                    id="searchInput"
                    placeholder="Buscar productos..."
                    aria-label="Buscar productos">
                <select class="select" id="sortSelect" aria-label="Ordenar productos">
                    <option class="option" value="todos">Todos los productos</option>
                    <option class="option" value="vendidos">Más vendidos</option>
                    <option class="option" value="oferta">En oferta</option>
                    <option class="option" value="precio-asc">Precio: menor a mayor</option>
                    <option class="option" value="precio-desc">Precio: mayor a menor</option>
                </select>
            </div>
            <p class="results-count" id="resultsCount"></p>
            <div class="grid-products" id="productGrid" data-categoria="accesorios"></div>
            <p class="empty-message" id="emptyMessage" hidden>No encontramos productos con esa búsqueda.</p>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p> &#174 CampusShop - Proyecto académico</p>
        </div>
    </footer>
    <script src="./JS/productos.js"></script>
    <script src="./JS/storage.js"></script>
    <script src="./JS/ui.js"></script>
    <script src="./JS/catalogo.js"></script>
</body>
</html>
